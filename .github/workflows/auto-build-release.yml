name: Auto Build and Release on yt-dlp Update

on:
  push:
    branches: [main]
  schedule:
    # Проверка каждый день в 03:00 UTC (06:00 MSK)
    - cron: "0 3 * * *"
  workflow_dispatch: # Ручной запуск

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      update_available: ${{ steps.check.outputs.update_available }}
      current_version: ${{ steps.check.outputs.current_version }}
      latest_version: ${{ steps.check.outputs.latest_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check for yt-dlp updates
        id: check
        run: |
          CURRENT=$(grep "^yt-dlp" requirements.txt | sed 's/.*==//g')
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT

          python -m pip install --upgrade pip
          LATEST=$(python -c "import urllib.request, json; data = json.loads(urllib.request.urlopen('https://pypi.org/pypi/yt-dlp/json').read()); print(data['info']['version'])")
          echo "latest_version=$LATEST" >> $GITHUB_OUTPUT

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "update_available=true" >> $GITHUB_OUTPUT
            echo "✅ Update available: $CURRENT → $LATEST"
          else
            echo "update_available=false" >> $GITHUB_OUTPUT
            echo "⏭️ No update needed (current: $CURRENT)"
          fi

  update-and-build:
    needs: check-update
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || needs.check-update.outputs.update_available == 'true')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update requirements.txt
        run: |
          $current = "${{ needs.check-update.outputs.current_version }}"
          $latest = "${{ needs.check-update.outputs.latest_version }}"
          (Get-Content requirements.txt) -replace '^yt-dlp(?:\[default\])?==.*$', "yt-dlp[default]==$latest" | Set-Content requirements.txt
          echo "Updated: yt-dlp $current → $latest"
          cat requirements.txt | findstr yt-dlp

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -LiteralPath "ffmpeg.zip" -DestinationPath "ffmpeg-download"
          $binary = Get-ChildItem -LiteralPath "ffmpeg-download" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$binary) { throw "FFmpeg executable missing from archive" }
          Copy-Item -LiteralPath $binary.FullName -Destination "ffmpeg.exe" -Force
          & .\ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg validation failed" }

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --no-cov

      - name: Build executable with PyInstaller
        run: |
          echo "Building with PyInstaller..."
          python -m PyInstaller --noconfirm --clean app.spec
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          if (Test-Path "dist/YouTube_Downloader.exe") {
            echo "✅ Build successful"
            Get-Item "dist/YouTube_Downloader.exe" | Format-List
          } else {
            echo "❌ Build failed"
            exit 1
          }

      - name: Prepare release assets
        run: ./.github/scripts/prepare-release-assets.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube_Downloader
          path: dist/*
          retention-days: 30

      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-update.outputs.latest_version }}-build.${{ github.run_number }}.${{ github.run_attempt }}
          name: v${{ needs.check-update.outputs.latest_version }} (build ${{ github.run_number }}.${{ github.run_attempt }})
          body: |
            ## 🚀 YouTube Downloader v${{ needs.check-update.outputs.latest_version }}

            ### 📝 Updates
            - **yt-dlp**: Updated from ${{ needs.check-update.outputs.current_version }} to ${{ needs.check-update.outputs.latest_version }}

            ### 📥 Downloads
            - **YouTube_Downloader.exe** - Windows 64-bit executable
            - **update-app.bat** - Update the executable (save beside the .exe)
            - **update-source.bat** - Update a Git source checkout
            - **launch.bat** - Launch the executable
            - **windows-scripts.zip** - Scripts with their original Russian filenames

            ### ⚙️ Requirements
            - Windows 10 or later
            - Internet connection
            - No installation required - just run the .exe!

            ### 🔗 References
            - [yt-dlp Release Notes](https://github.com/yt-dlp/yt-dlp/releases/tag/${{ needs.check-update.outputs.latest_version }})
            - [View all releases](https://github.com/${{ github.repository }}/releases)
          files: |
            dist/YouTube_Downloader.exe
            dist/update-app.bat
            dist/update-source.bat
            dist/launch.bat
            dist/windows-scripts.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: |
            ## 🚀 YouTube Downloader (Latest Build)

            **yt-dlp version**: ${{ needs.check-update.outputs.latest_version }}

            This is the latest stable build with the most recent yt-dlp updates.

            💾 **Download YouTube_Downloader.exe** below and run it!
            Use **update-app.bat** to update it, or **launch.bat** to launch it.
            **windows-scripts.zip** contains the scripts with their original Russian filenames.

            📖 [View all releases](https://github.com/${{ github.repository }}/releases)
          files: |
            dist/YouTube_Downloader.exe
            dist/update-app.bat
            dist/update-source.bat
            dist/launch.bat
            dist/windows-scripts.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push updated requirements.txt
        if: needs.check-update.outputs.update_available == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add requirements.txt
          git commit -m "chore: update yt-dlp to ${{ needs.check-update.outputs.latest_version }}"
          if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
          git push
          if ($LASTEXITCODE -ne 0) { throw "Push failed (check branch protection)" }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workflow summary
        run: |
          echo "## ✅ Workflow completed successfully!" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### Summary" >> $env:GITHUB_STEP_SUMMARY
          echo "- yt-dlp: ${{ needs.check-update.outputs.current_version }} → ${{ needs.check-update.outputs.latest_version }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- requirements.txt: Updated ✅" >> $env:GITHUB_STEP_SUMMARY
          echo "- Build: Successful ✅" >> $env:GITHUB_STEP_SUMMARY
          echo "- Release: Published ✅" >> $env:GITHUB_STEP_SUMMARY
